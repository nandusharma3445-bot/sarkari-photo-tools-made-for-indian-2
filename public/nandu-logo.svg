<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Dark Navy Ring -->
  <circle cx="256" cy="256" r="248" fill="#0C2B54" />

  <!-- Inner Gold Circular Ring -->
  <circle cx="256" cy="256" r="214" fill="#FFFFFF" stroke="#DE8A1E" stroke-width="5" />

  <!-- Monogram N -->
  <g id="monogram-N">
    <!-- Left Pillar Outer (Orange) -->
    <rect x="160" y="128" width="20" height="194" fill="#DE8A1E" />

    <!-- Left Pillar Inner Top (Navy) -->
    <rect x="180" y="128" width="20" height="36" fill="#0C2B54" />

    <!-- Left Pillar Inner Bottom (Navy) -->
    <rect x="180" y="278" width="20" height="44" fill="#0C2B54" />

    <!-- Right Pillar Inner Top (Navy) -->
    <rect x="312" y="128" width="20" height="44" fill="#0C2B54" />

    <!-- Right Pillar Inner Bottom (Navy) -->
    <rect x="312" y="286" width="20" height="36" fill="#0C2B54" />

    <!-- Right Pillar Outer (Orange) -->
    <rect x="332" y="128" width="20" height="194" fill="#DE8A1E" />

    <!-- Top Diagonal Stripe (Navy) -->
    <polygon points="180,140 200,140 312,252 312,272" fill="#0C2B54" />

    <!-- Middle Diagonal Stripe (Orange) -->
    <polygon points="180,172 200,172 312,284 312,304 312,322 300,322 180,202" fill="#DE8A1E" />

    <!-- Bottom Diagonal Stripe (Navy) -->
    <polygon points="180,202 200,202 312,314 312,322 292,322 180,210" fill="#0C2B54" />
    <polygon points="180,210 200,210 270,280 270,300 180,230" fill="#0C2B54" />
    <polygon points="180,230 180,278 200,278 200,250" fill="#0C2B54" />
  </g>

  <!-- Typography Below "N" -->
  <!-- NANDU SHARMA -->
  <text
    x="256"
    y="370"
    fill="#0C2B54"
    font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="5"
    text-anchor="middle"
  >NANDU SHARMA</text>

  <!-- PERSONAL BRAND -->
  <text
    x="256"
    y="396"
    fill="#DE8A1E"
    font-family="'Plus Jakarta Sans', Arial, -apple-system, sans-serif"
    font-size="14.5"
    font-weight="700"
    letter-spacing="5.5"
    text-anchor="middle"
  >PERSONAL BRAND</text>
</svg>
